name: "Release: prepare"

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    permissions:
      contents: write
      pull-requests: write
    uses: hexadrop/github-workflows/.github/workflows/release-prepare.yml@v1.7.5
    with:
      base-branch: main
      use-app-token: true
    secrets:
      app-private-key: ${{ secrets.HEXABOT_PRIVATE_KEY }}
